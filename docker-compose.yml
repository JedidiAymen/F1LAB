services:
  postgres:
    image: postgres:17
    container_name: racelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: racelab
      POSTGRES_PASSWORD: racelab
      POSTGRES_DB: racelab
    ports:
      - "5432:5432"
    volumes:
      - racelab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racelab -d racelab"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: racelab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: racelab
      MINIO_ROOT_PASSWORD: racelab-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - racelab-minio:/data

volumes:
  racelab-postgres:
  racelab-minio:
