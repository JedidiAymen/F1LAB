name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit tests (synthetic fixtures; no network, no downloaded data)
        run: uv run pytest -q -W ignore
      - name: Type check
        run: uv run mypy src/f1_racelab

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Type check and build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate all optional profiles
        run: docker compose --profile '*' config --quiet
      - name: Build and start basic app without research data or optional services
        run: docker compose up --build --wait --wait-timeout 180 api web
      - name: Verify same-origin API, tracing, SPA fallback and missing-data contract
        run: uv run --frozen python scripts/smoke_compose.py
      - name: Container diagnostics
        if: always()
        run: docker compose ps -a && docker compose logs --tail 100
      - name: Stop disposable services
        if: always()
        run: docker compose down
