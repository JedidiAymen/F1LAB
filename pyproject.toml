[project]
name = "f1-racelab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aymen Jedidi", email = "aymen.jedidi@ensi-uma.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "fastf1>=3.8.3",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "polars>=1.44.2",
    "psycopg>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
    "xgboost>=3.4.1",
]

[project.scripts]
f1-racelab = "f1_racelab:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
